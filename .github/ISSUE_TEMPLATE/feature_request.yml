name: Feature / User Story
description: Propose a feature for the Accounts Management application
title: "[STORY] "
labels: ["user-story"]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: "As a..., I want..., so that..."
      placeholder: "As an account manager, I want to update account details so that records stay accurate."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- Given... When... Then..."
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: ["High", "Medium", "Low"]
    validations:
      required: true
